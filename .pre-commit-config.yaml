default_language_version:
  python: python3.14

repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.3
  hooks:
   - id: ruff-check
     files: ^(src/|scripts/|tests/typing/|tests/test_public_runtime_annotations.py$)
     args: [ --fix ]
   - id: ruff-format

- repo: local
  hooks:
   - id: mypy
     name: mypy
     entry: mypy
     language: system
     types: [python]
     pass_filenames: false
     args: [src/anemone]

   - id: pylint
     name: pylint
     entry: pylint
     language: system
     types: [python]
     pass_filenames: false
     args: [src/anemone]

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
   - id: trailing-whitespace
   - id: end-of-file-fixer
   - id: check-yaml
   - id: check-added-large-files
   - id: check-merge-conflict
