[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"


[project]
name = "algorhino-anemone"
version = "0.2.27.dev0"
description = "anemone searches trees"
keywords = ["tree", "search"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
requires-python = ">=3.14"
dependencies = [
    "valanga==0.2.5",
    "rich",
    "sortedcollections>=2.1.0",
    "PyYAML>=6.0",
  "orjson",
  "zstandard",
]

license = "GPL-3.0-only"
license-files = ["LICENSE"]

readme = { file = "README.md", content-type = "text/markdown" }

authors = [
  { name = "Victor Gabillon", email = "victorgabillon@gmail.com" }
]

[project.optional-dependencies]
debug = [
  "graphviz",
]

test = [
  "pytest==9.1.1",
  "coverage==7.17.0",
  "pytest-cov==7.1.0",
  "atomheart==0.2.11",
  "parsley-coco==0.1.36",
]

lint = [
  "ruff==0.17.3",
  "pylint==4.1.3",
]

typecheck = [
  "mypy==2.4.0",
  "pyright[nodejs]==1.1.414",
  "types-PyYAML==6.0.12.20260906",
]

dev = [
  "tox==4.67.2",
  "black==26.10.1",
  "build==1.6.1",
  "twine==7.0.0",
  "sphinx==9.2.0",
  "sphinx-rtd-theme==3.1.0",
  "sphinx-autodoc-typehints==3.17.3",
  "pre-commit==4.7.0",
  # optionally include lint/typecheck/test here too (up to you)
]

nn = [
  "algorhino-coral",
  "torch>=2.14.1",
]


profiling-viz = [
   "streamlit>=1.44.0",
  "snakeviz",
  "gprof2dot",
]

docs = [
  "sphinx==9.2.0",
  "sphinx-rtd-theme==3.1.0",
  "myst-parser==5.1.0",
]


[project.urls]
Homepage = "https://github.com/victorgabillon/anemone"
"Bug Tracker" = "https://github.com/victorgabillon/anemone/issues"


[tool.setuptools]
include-package-data = true


[tool.setuptools.package-data]
anemone = ["py.typed"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["anemone", "anemone.*"]



[tool.pytest.ini_options]
addopts = "--cov=anemone --import-mode=importlib"
testpaths = [
    "anemone",
    "tests"
]
markers = [
    "unit: fast unit tests",
    "integration: slower integration tests",
]



[tool.mypy]
strict = true
ignore_missing_imports = true
mypy_path = "."
show_error_codes = true
warn_unreachable = true
no_implicit_reexport = true
python_version = "3.14"

# Disallow dynamic typing
#disallow_any_unimported = true
#disallow_any_expr = true
#disallow_any_decorated = true
#disallow_any_generics = true
#disallow_any_explicit = true
#disallow_subclassing_any = true

# Disallow untyped definitions and calls
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true

# None and optional handling
no_implicit_optional = true

# Configuring warnings
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_redundant_casts = true

# Misc things
strict_equality = true

# Config file
warn_unused_configs = true



[tool.ruff]
line-length = 88
target-version = "py314"

# Enable import sorting (alphabetical + group order)
lint.select = ["I", "F", "E", "B", "TC","UP","SIM", "RUF","RET","N","A",
"ANN", "PERF", "TRY","LOG","RSE","ICN","TID","Q","W","D",
"ISC","PIE","ERA","TD"]  # I = imports, F = pyflakes, E = pycodestyle, TCH = type-checking, B = black

# Allow auto-fixing for imports and type-checking imports
lint.fixable = ["I", "TC", "D","F401","UP","SIM","RET","RUF","E","TRY","PERF","RSE","ANN","PIE","ERA","TD"]

# Ignore rules you don't care about
lint.ignore = [ "E501",
  "ANN401",
  "TD003",
  "TD002",
  "D203",  # incompatible with D211
  "D213",  # incompatible with D212
    ]

# Optional: add your first-party package to extend the known group
[tool.ruff.lint.per-file-ignores]
# If needed, can add file-specific ignores

[tool.black]
line-length = 88
target-version = ['py314']


[tool.pylint]
py-version = "3.14"
extension-pkg-whitelist = ["PyQt5", "PySide6"]

[tool.pylint.format]
max-line-length = 88

#[tool.pylint.messages_control]
disable = [
    "C0301",
      "C0302",

    "unnecessary-ellipsis",
    "W0511","R0913","R0911","R0917","R0903","R0914","R0912","R0915","R0904","R0902",
    ]


[tool.pylint.typecheck]
# Optional: same as init-hook in .pylintrc
init-hook = "import sys; sys.path.append('.')"

[tool.pylint.design]
min-public-methods = 1






[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false



# Avoid scanning huge generated folders
exclude = [
  ".venv",
  "**/.venv",
  ".tox",
  "**/.tox",
  "build==1.6.1",
  "dist",
  "**/__pycache__",
  ".mypy_cache",
  ".ruff_cache",
  ".pytest_cache",
  "src/anemone/**/torch_*.py",
]

extraPaths = ["src"]

# Exact foundation wheels are supplied by CI or the isolated local environment.
[tool.tox]
min_version = "4.67.2"
env_list = ["py314", "lint", "typecheck", "build"]

[tool.tox.env_run_base]
base_python = ["python3.14"]
pass_env = ["TMPDIR", "XDG_CACHE_HOME", "PIP_CACHE_DIR", "PYTHONPYCACHEPREFIX", "MYPY_CACHE_DIR", "RUFF_CACHE_DIR", "PYLINTHOME", "PYRIGHT_PYTHON_FORCE_VERSION"]
set_env = { PYTHON_JIT = "0", COVERAGE_FILE = "{envtmpdir}/.coverage", OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", MKL_NUM_THREADS = "1" }

[tool.tox.env.py314]
package = "external"
description = "Complete installed-package tests and branch coverage"
extras = ["test", "debug"]
deps = ["{env:VALANGA_WHEEL}", "{env:ATOMHEART_WHEEL}", "{env:PARSLEY_WHEEL}"]
commands = [["python", "scripts/ci_test_metrics.py", "--durations=30", "--cov-branch", "--cov-report=term", "--cov-report=json:{envtmpdir}/coverage.json", "--junitxml={envtmpdir}/pytest.xml", "-o", "cache_dir={envtmpdir}/pytest-cache", "--basetemp={envtmpdir}/pytest", "{posargs}"]]
set_env = { CI_REPORT_DIR = "{envtmpdir}", COVERAGE_FILE = "{envtmpdir}/.coverage", PYTHON_JIT = "0", OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", MKL_NUM_THREADS = "1" }

[tool.tox.env.lint]
description = "Ruff, formatting and strict pylint"
package = "skip"
deps = [
  "{env:VALANGA_WHEEL}",
  "rich>=15.0.0",
  "PyYAML>=6.0.3",
  "sortedcollections>=2.1.0",
  "orjson>=3.13.0",
  "zstandard>=0.25.0",
  "graphviz>=0.21",
  "ruff==0.17.3", "pylint==4.1.3",
]
set_env = { PYTHONPATH = "{toxinidir}/src", PYTHON_JIT = "0" }
commands = [
  ["python", "-m", "ruff", "check", "src", "scripts", "tests/typing"],
  ["python", "-m", "ruff", "format", "--check", "src", "tests", "scripts"],
  ["python", "-m", "pylint", "src/anemone"],
]

[tool.tox.env.typecheck]
description = "Strict mypy, Pyright and positive/negative generic contracts"
package = "skip"
deps = [
  "{env:VALANGA_WHEEL}",
  "rich>=15.0.0",
  "PyYAML>=6.0.3",
  "sortedcollections>=2.1.0",
  "orjson>=3.13.0",
  "zstandard>=0.25.0",
  "graphviz>=0.21",
  "mypy==2.4.0", "pyright[nodejs]==1.1.414", "types-PyYAML==6.0.12.20260906",
]
set_env = { MYPYPATH = "{toxinidir}/src", PYTHONPATH = "{toxinidir}/src", PYTHON_JIT = "0" }
commands = [
  ["python", "-m", "mypy", "--strict", "src/anemone", "tests/typing/contracts.py"],
  ["python", "-m", "pyright", "src/anemone", "tests/typing/contracts.py"],
  ["python", "scripts/check_type_contracts.py"],
]

[tool.tox.env.build]
description = "Build wheel/sdist in private staging and validate strict metadata"
package = "skip"
deps = ["build==1.6.1", "twine==7.0.0"]
commands = [
  ["python", "scripts/build_distributions.py", "{envtmpdir}/dist"],
  ["python", "-m", "twine", "check", "--strict", "{envtmpdir}/dist/*"],
]

[tool.tox.env_pkg_base]
base_python = ["python3.14"]
deps = ["build==1.6.1"]
pass_env = ["TMPDIR", "PIP_CACHE_DIR", "PYTHONPYCACHEPREFIX", "XDG_CACHE_HOME"]
commands = [["python", "{toxinidir}/scripts/build_distributions.py", "{envtmpdir}/dist"]]
package_glob = "{envtmpdir}/dist/*.whl"
