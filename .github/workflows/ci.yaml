name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox==4.56.1

      - name: Run tox (tests + lint + typecheck)
        run: tox

      - name: Record CI environment and disk usage
        if: always()
        run: |
          mkdir -p .ci-reports
          python -m pip cache info
          du -sh ~/.cache/pip .tox || true
          df -h .
          .tox/py313/bin/python -m pip list --format=json > .ci-reports/dependencies.json

      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-evidence
          path: |
            .ci-reports/
            .tox/static/tmp/static-analysis/
          include-hidden-files: true
